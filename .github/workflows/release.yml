name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            build_flags: ""
          - os: macos-14
            target: aarch64-apple-darwin
            build_flags: ""
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            build_flags: ""

    steps:
      - name: Check for existing release asset
        id: release_asset
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          archive="enf-${{ matrix.target }}.tar.gz"
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' | grep -Fx "$archive" >/dev/null; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "$archive already exists on $GITHUB_REF_NAME; skipping build"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.release_asset.outputs.exists != 'true'
      - uses: dtolnay/rust-toolchain@stable
        if: steps.release_asset.outputs.exists != 'true'
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        if: steps.release_asset.outputs.exists != 'true'
      - run: cargo build --release --locked --target ${{ matrix.target }} ${{ matrix.build_flags }}
        if: steps.release_asset.outputs.exists != 'true'
      - name: Package archive
        if: steps.release_asset.outputs.exists != 'true'
        shell: bash
        run: |
          mkdir -p dist
          bin="enf"
          if [[ "${{ matrix.target }}" == *"windows"* ]]; then
            bin="enf.exe"
          fi
          cp "target/${{ matrix.target }}/release/$bin" "dist/$bin"
          tar -C dist -czf "enf-${{ matrix.target }}.tar.gz" "$bin"
          if command -v shasum >/dev/null 2>&1; then
            shasum -a 256 "enf-${{ matrix.target }}.tar.gz" > "enf-${{ matrix.target }}.tar.gz.sha256"
          else
            sha256sum "enf-${{ matrix.target }}.tar.gz" > "enf-${{ matrix.target }}.tar.gz.sha256"
          fi
      - uses: softprops/action-gh-release@v2
        if: steps.release_asset.outputs.exists != 'true'
        with:
          files: |
            enf-${{ matrix.target }}.tar.gz
            enf-${{ matrix.target }}.tar.gz.sha256
