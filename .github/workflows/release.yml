name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-13
            target: x86_64-apple-darwin
          - os: macos-14
            target: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc

    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Package archive
        shell: bash
        run: |
          mkdir -p dist
          bin="enf"
          if [[ "${{ matrix.target }}" == *"windows"* ]]; then
            bin="enf.exe"
          fi
          cp "target/${{ matrix.target }}/release/$bin" "dist/$bin"
          tar -C dist -czf "enf-${{ matrix.target }}.tar.gz" "$bin"
          if command -v shasum >/dev/null 2>&1; then
            shasum -a 256 "enf-${{ matrix.target }}.tar.gz" > "enf-${{ matrix.target }}.tar.gz.sha256"
          else
            sha256sum "enf-${{ matrix.target }}.tar.gz" > "enf-${{ matrix.target }}.tar.gz.sha256"
          fi
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            enf-${{ matrix.target }}.tar.gz
            enf-${{ matrix.target }}.tar.gz.sha256
