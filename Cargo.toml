[package]
name = "elephant-never-forgets"
version = "1.1.0"
edition = "2021"
rust-version = "1.80"
description = "Native-first CLI semantic search for directories, repos, docs, and agent workflows."
license = "MIT"
readme = "README.md"
repository = "https://github.com/Elephant-Hand-Games/elephant-never-forgets-cli"
keywords = ["search", "semantic-search", "rag", "sqlite", "cli"]
categories = ["command-line-utilities", "text-processing"]

[[bin]]
name = "enf"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
async-trait = "0.1"
blake3 = "1.5"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
clap = { version = "4.5", features = ["derive", "env"] }
dirs = "5.0"
fastembed = "5.15"
globset = "0.4"
ignore = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "blocking"] }
rusqlite = { version = "0.32", features = ["bundled", "chrono"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tempfile = "3.10"
thiserror = "1.0"
toml = "0.8"
walkdir = "2.5"
zip = { version = "2.1", default-features = false, features = ["deflate"] }

[dev-dependencies]
assert_cmd = "2.0"
predicates = "3.1"
insta = { version = "1.39", features = ["json"] }
